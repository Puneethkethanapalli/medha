<body class="bg-background text-on-background min-h-screen flex flex-col items-center">
<div class="w-full max-w-md mx-auto min-h-screen bg-background relative flex flex-col pb-safe">

<header class="flex justify-between items-center px-6 h-16 w-full fixed top-0 w-full z-50 bg-[#131315]/80 backdrop-blur-md shadow-none">
<button class="text-on-surface-variant hover:text-primary transition-colors duration-300 active:scale-95 transition-transform flex items-center justify-center p-2 -ml-2 rounded-full hover:bg-surface-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline font-semibold text-base text-primary absolute left-1/2 transform -translate-x-1/2">API Keys</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- MAIN CONTENT -->
<main class="flex-1 overflow-y-auto px-4 pt-20 pb-8 flex flex-col gap-4">
<!-- PROVIDER CARDS -->
<!-- OpenRouter Card -->
<div class="bg-surface-container-lowest rounded-xl p-4 transition-colors duration-300 outline outline-1 outline-outline-variant/15 flex flex-col gap-3 group relative overflow-hidden">
<!-- Subtle ambient glow for connected state -->
<div class="absolute inset-0 bg-primary/5 opacity-0 transition-opacity duration-300 pointer-events-none group-hover:opacity-100"></div>
<div class="flex items-center justify-between z-10 relative">
<h2 class="font-headline font-semibold text-primary text-base tracking-tight">OpenRouter</h2>
<div class="flex items-center gap-2">
<span class="text-xs text-on-surface-variant font-medium">Connected</span>
<div class="w-2 h-2 rounded-full bg-[#22C55E]"></div>
</div>
</div>
<div class="z-10 relative">
<p class="font-mono text-[13px] text-on-surface-variant break-all bg-surface-container-low px-3 py-2 rounded-md border border-outline-variant/10">sk-or-...x4f2</p>
</div>
<div class="flex items-center gap-2 pt-1 z-10 relative">
<button class="bg-surface-container hover:bg-surface-container-high transition-colors text-on-surface-variant flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium active:scale-95">
<span class="material-symbols-outlined text-[14px]">bolt</span>
                        Test
                    </button>
<button class="bg-surface-container hover:bg-surface-container-high transition-colors text-error flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium active:scale-95">
<span class="material-symbols-outlined text-[14px]">delete</span>
                        Delete
                    </button>
</div>
</div>
<!-- Gemini Card -->
<div class="bg-surface-container-lowest rounded-xl p-4 transition-colors duration-300 outline outline-1 outline-outline-variant/15 flex flex-col gap-3">
<div class="flex items-center justify-between">
<h2 class="font-headline font-semibold text-primary text-base tracking-tight">Gemini</h2>
<span class="text-[13px] text-on-surface-variant">Not connected</span>
</div>
<button class="w-full h-11 bg-surface-container hover:bg-surface-container-high transition-colors rounded-lg outline outline-1 outline-dashed outline-outline-variant/30 flex items-center justify-center gap-2 text-sm text-on-surface-variant font-medium active:scale-95">

                </button>
</div>
