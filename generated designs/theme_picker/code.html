<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Medha - Theme Picker</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/lucide@latest"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "error": "#ffb4ab",
                        "on-tertiary": "#1b1b1e",
                        "surface-container": "#201f22",
                        "on-error-container": "#ffdad6",
                        "on-surface": "#e5e1e4",
                        "tertiary": "#e4e1e5",
                        "surface-container-high": "#2a2a2c",
                        "primary": "#ffffff",
                        "surface-container-highest": "#353437",
                        "secondary-container": "#47464a",
                        "on-secondary": "#1b1b1e",
                        "surface-bright": "#39393b",
                        "on-primary-fixed": "#ffffff",
                        "on-primary-fixed-variant": "#e2e2e2",
                        "on-primary": "#1a1c1c",
                        "inverse-on-surface": "#313032",
                        "error-container": "#93000a",
                        "secondary": "#c8c5ca",
                        "inverse-surface": "#e5e1e4",
                        "tertiary-fixed-dim": "#47464a",
                        "on-tertiary-fixed-variant": "#e4e1e5",
                        "surface": "#131315",
                        "secondary-fixed": "#c8c5ca",
                        "outline": "#919191",
                        "on-error": "#690005",
                        "on-secondary-fixed-variant": "#3b3b3e",
                        "surface-container-lowest": "#0e0e10",
                        "secondary-fixed-dim": "#acaaae",
                        "on-secondary-container": "#e4e1e6",
                        "surface-tint": "#c6c6c7",
                        "on-tertiary-fixed": "#ffffff",
                        "primary-container": "#d4d4d4",
                        "primary-fixed-dim": "#454747",
                        "on-surface-variant": "#c6c6c6",
                        "background": "#131315",
                        "on-secondary-fixed": "#1b1b1e",
                        "inverse-primary": "#5d5f5f",
                        "on-primary-container": "#000000",
                        "primary-fixed": "#5d5f5f",
                        "on-tertiary-container": "#000000",
                        "surface-container-low": "#1c1b1d",
                        "surface-variant": "#353437",
                        "on-background": "#e5e1e4",
                        "tertiary-fixed": "#5f5e61",
                        "outline-variant": "#474747",
                        "surface-dim": "#131315",
                        "tertiary-container": "#919094",
                        
                        // Custom precise colors from prompt
                        "medha-bg": "#09090B",
                        "medha-surface": "#18181B",
                        "medha-border": "#27272A",
                        "medha-primary": "#FAFAFA",
                        "medha-secondary": "#A1A1AA",
                        "medha-tertiary": "#71717A"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-medha-bg text-medha-primary h-screen w-full flex justify-center items-center overflow-hidden antialiased">
<!-- Mock Background (Settings Screen Dimmed) -->
<div class="absolute inset-0 bg-medha-bg">
<!-- Top App Bar Mock -->
<header class="flex items-center justify-between px-6 py-4 w-full border-b border-medha-border bg-medha-bg top-0 sticky">
<i class="w-5 h-5 text-medha-primary opacity-50" data-lucide="menu"></i>
<h1 class="text-xl font-bold tracking-tighter text-medha-primary opacity-50">Medha</h1>
<div class="w-8 h-8 rounded-full bg-medha-surface border border-medha-border opacity-50"></div>
</header>
<!-- Mock Content -->
<div class="p-6 space-y-6 opacity-30">
<div class="flex items-center justify-between py-4 border-b border-medha-border/50">
<span class="text-medha-primary font-medium">Account</span>
<i class="w-4 h-4 text-medha-tertiary" data-lucide="chevron-right"></i>
</div>
<div class="flex items-center justify-between py-4 border-b border-medha-border/50">
<span class="text-medha-primary font-medium">Appearance</span>
<i class="w-4 h-4 text-medha-tertiary" data-lucide="chevron-right"></i>
</div>
<div class="flex items-center justify-between py-4 border-b border-medha-border/50">
<span class="text-medha-primary font-medium">Notifications</span>
<i class="w-4 h-4 text-medha-tertiary" data-lucide="chevron-right"></i>
</div>
</div>
</div>
<!-- Overlay Dimming -->
<div class="absolute inset-0 bg-black/50 z-40"></div>
<!-- Bottom Sheet -->
<div class="absolute bottom-0 left-0 w-full bg-medha-bg rounded-t-[16px] z-50 flex flex-col items-center border-t border-medha-border" style="height: 40vh; min-height: 320px;">
<!-- Handle -->
<div class="w-[40px] h-[4px] bg-medha-border rounded-full mt-3 mb-1"></div>
<!-- Header -->
<div class="w-full flex justify-between items-center px-4 py-4">
<h2 class="text-[16px] font-semibold text-medha-primary tracking-tight">Theme</h2>
<i class="w-5 h-5 text-medha-secondary cursor-pointer hover:text-medha-primary transition-colors" data-lucide="x"></i>
</div>
<!-- Theme Options Grid -->
<div class="w-full px-4 grid grid-cols-3 gap-3">
<!-- Dark Theme (Selected) -->
<div class="flex flex-col items-center gap-2 cursor-pointer group">
<div class="w-full h-[64px] rounded-lg border border-medha-primary bg-medha-bg flex flex-col p-2 gap-1.5 relative overflow-hidden">
<!-- Mock UI Lines -->
<div class="w-full h-2 rounded bg-medha-surface"></div>
<div class="w-2/3 h-2 rounded bg-medha-surface"></div>
<div class="w-4/5 h-2 rounded bg-medha-surface ml-auto"></div>
</div>
<div class="flex flex-col items-center justify-center h-8">
<span class="text-[12px] font-medium text-medha-primary">Dark</span>
<i class="w-3 h-3 text-medha-primary mt-0.5" data-lucide="check"></i>
</div>
</div>
<!-- Light Theme -->
<div class="flex flex-col items-center gap-2 cursor-pointer group">
<div class="w-full h-[64px] rounded-lg border border-medha-border bg-white flex flex-col p-2 gap-1.5 relative overflow-hidden">
<!-- Mock UI Lines -->
<div class="w-full h-2 rounded bg-gray-100"></div>
<div class="w-2/3 h-2 rounded bg-gray-100"></div>
<div class="w-4/5 h-2 rounded bg-gray-200 ml-auto"></div>
</div>
<div class="flex flex-col items-center justify-center h-8">
<span class="text-[12px] font-normal text-medha-secondary group-hover:text-medha-primary transition-colors">Light</span>
</div>
</div>
<!-- OLED Theme -->
<div class="flex flex-col items-center gap-2 cursor-pointer group">
<div class="w-full h-[64px] rounded-lg border border-medha-border bg-black flex flex-col p-2 gap-1.5 relative overflow-hidden">
<!-- Mock UI Lines -->
<div class="w-full h-2 rounded bg-gray-900"></div>
<div class="w-2/3 h-2 rounded bg-gray-900"></div>
<div class="w-4/5 h-2 rounded bg-gray-800 ml-auto"></div>
</div>
<div class="flex flex-col items-center justify-center h-8">
<span class="text-[12px] font-normal text-medha-secondary group-hover:text-medha-primary transition-colors">OLED</span>
</div>
</div>
</div>
<!-- System Toggle -->
<div class="w-full px-4 mt-6">
<div class="flex items-center justify-between py-3 cursor-pointer group">
<span class="text-[14px] text-medha-primary font-medium group-hover:text-medha-primary/80 transition-colors">Match system theme</span>
<!-- Toggle Switch (Off state) -->
<button aria-checked="false" class="relative inline-flex h-5 w-9 shrink-0 cursor-pointer items-center justify-center rounded-full bg-medha-surface border border-medha-border outline-none transition-colors" role="switch" type="button">
<span class="translate-x-0 pointer-events-none inline-block h-3.5 w-3.5 transform rounded-full bg-medha-secondary shadow ring-0 transition duration-200 ease-in-out relative -left-[7px]"></span>
</button>
</div>
</div>
</div>
<!-- Bottom Nav Bar Mock (Hidden on mobile modal overlay, but structural) -->
<!-- Suppressed due to modal overlay priority -->
<script>
        lucide.createIcons();
    </script>
</body></html>
