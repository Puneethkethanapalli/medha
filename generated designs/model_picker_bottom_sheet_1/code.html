<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Medha AI - Model Picker</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-low": "#1c1b1d",
                        "outline-variant": "#474747",
                        "on-secondary": "#1b1b1e",
                        "on-error": "#690005",
                        "surface-container-highest": "#353437",
                        "on-primary-fixed-variant": "#e2e2e2",
                        "surface-bright": "#39393b",
                        "primary": "#ffffff",
                        "primary-container": "#d4d4d4",
                        "surface-tint": "#c6c6c7",
                        "inverse-primary": "#5d5f5f",
                        "on-tertiary-fixed-variant": "#e4e1e5",
                        "tertiary": "#e4e1e5",
                        "secondary-fixed-dim": "#acaaae",
                        "tertiary-fixed": "#5f5e61",
                        "error-container": "#93000a",
                        "on-surface": "#e5e1e4",
                        "surface-container-lowest": "#0e0e10",
                        "on-primary-fixed": "#ffffff",
                        "tertiary-fixed-dim": "#47464a",
                        "on-surface-variant": "#c6c6c6",
                        "surface-container": "#201f22",
                        "on-secondary-fixed-variant": "#3b3b3e",
                        "secondary": "#c8c5ca",
                        "surface-variant": "#353437",
                        "on-secondary-container": "#e4e1e6",
                        "surface-dim": "#131315",
                        "secondary-container": "#47464a",
                        "tertiary-container": "#919094",
                        "primary-fixed": "#5d5f5f",
                        "error": "#ffb4ab",
                        "secondary-fixed": "#c8c5ca",
                        "on-secondary-fixed": "#1b1b1e",
                        "on-error-container": "#ffdad6",
                        "on-primary-container": "#000000",
                        "inverse-on-surface": "#313032",
                        "on-tertiary-container": "#000000",
                        "on-primary": "#1a1c1c",
                        "surface-container-high": "#2a2a2c",
                        "outline": "#919191",
                        "background": "#131315",
                        "primary-fixed-dim": "#454747",
                        "inverse-surface": "#e5e1e4",
                        "on-background": "#e5e1e4",
                        "surface": "#131315",
                        "on-tertiary": "#1b1b1e",
                        "on-tertiary-fixed": "#ffffff"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface antialiased h-screen w-full relative overflow-hidden flex flex-col justify-end">
<!-- Dimmed Background Overlay -->
<div aria-hidden="true" class="absolute inset-0 bg-black/50 z-10 backdrop-blur-[2px]"></div>
<!-- Bottom Sheet -->
<div class="relative z-20 w-full max-w-md mx-auto bg-surface-container-lowest h-[618px] rounded-t-[16px] flex flex-col shadow-2xl overflow-hidden shadow-[0_-10px_40px_rgba(0,0,0,0.5)] border-t border-outline-variant/15">
<!-- Handle -->
<div class="w-full flex justify-center pt-2 pb-4">
<div class="w-10 h-1 rounded-full bg-surface-container-high"></div>
</div>
<!-- Header -->
<div class="flex items-center justify-between px-4 pb-4">
<h2 class="text-[16px] font-semibold text-primary tracking-tight">Select Model</h2>
<button class="p-1 rounded-full hover:bg-surface-container transition-colors duration-300 group">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant group-hover:text-primary transition-colors duration-300" data-icon="close">close</span>
</button>
</div>
<!-- Search -->
<div class="px-4 pb-4 shrink-0">
<div class="relative flex items-center bg-surface-container rounded-lg h-10 px-3 transition-colors duration-300 focus-within:bg-surface-container-high ring-1 ring-inset ring-transparent focus-within:ring-outline-variant/30">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant mr-2" data-icon="search">search</span>
<input class="w-full bg-transparent text-[13px] text-primary placeholder-on-surface-variant focus:outline-none border-none p-0 focus:ring-0" placeholder="Search models..." type="text"/>
</div>
</div>
<!-- Model List -->
<div class="flex-1 overflow-y-auto hide-scrollbar px-4 pb-8 space-y-6">
<!-- Group: OPENAI -->
<div>
<h3 class="text-[11px] font-semibold text-inverse-primary uppercase tracking-widest mb-2 px-2">OpenAI</h3>
<div class="bg-surface-container-low rounded-xl overflow-hidden border border-outline-variant/15">
<button class="w-full h-[52px] px-4 flex items-center justify-between hover:bg-surface-container-high transition-colors duration-300 border-b border-outline-variant/10 last:border-b-0">
<span class="text-[14px] text-on-surface">GPT-4o</span>
<span class="text-[12px] text-on-surface-variant font-mono">128K</span>
</button>
<!-- Selected State -->
<button class="w-full h-[52px] px-4 flex items-center justify-between bg-surface-container-high transition-colors duration-300 border-b border-outline-variant/10 last:border-b-0 relative before:absolute before:left-0 before:top-0 before:bottom-0 before:w-[2px] before:bg-primary">
<span class="text-[14px] text-primary font-medium">GPT-4o Mini</span>
<div class="flex items-center space-x-3">
<span class="text-[12px] text-on-surface-variant font-mono">128K</span>
<span class="material-symbols-outlined text-[18px] text-primary" data-icon="check">check</span>
</div>
</button>
<button class="w-full h-[52px] px-4 flex items-center justify-between hover:bg-surface-container-high transition-colors duration-300 border-b border-outline-variant/10 last:border-b-0">
<span class="text-[14px] text-on-surface">o1</span>
<span class="text-[12px] text-on-surface-variant font-mono">200K</span>
</button>
</div>
</div>
<!-- Group: ANTHROPIC -->
<div>
<h3 class="text-[11px] font-semibold text-inverse-primary uppercase tracking-widest mb-2 px-2">Anthropic</h3>
<div class="bg-surface-container-low rounded-xl overflow-hidden border border-outline-variant/15">
<button class="w-full h-[52px] px-4 flex items-center justify-between hover:bg-surface-container-high transition-colors duration-300 border-b border-outline-variant/10 last:border-b-0">
<span class="text-[14px] text-on-surface">Claude 3.5 Sonnet</span>
<span class="text-[12px] text-on-surface-variant font-mono">200K</span>
</button>
<button class="w-full h-[52px] px-4 flex items-center justify-between hover:bg-surface-container-high transition-colors duration-300 border-b border-outline-variant/10 last:border-b-0">
<span class="text-[14px] text-on-surface">Claude 3.5 Haiku</span>
<span class="text-[12px] text-on-surface-variant font-mono">200K</span>
</button>
<button class="w-full h-[52px] px-4 flex items-center justify-between hover:bg-surface-container-high transition-colors duration-300 border-b border-outline-variant/10 last:border-b-0">
<span class="text-[14px] text-on-surface">Claude 3 Opus</span>
<span class="text-[12px] text-on-surface-variant font-mono">200K</span>
</button>
</div>
</div>
<!-- Group: GOOGLE -->
<div>
<h3 class="text-[11px] font-semibold text-inverse-primary uppercase tracking-widest mb-2 px-2">Google</h3>
<div class="bg-surface-container-low rounded-xl overflow-hidden border border-outline-variant/15">
<button class="w-full h-[52px] px-4 flex items-center justify-between hover:bg-surface-container-high transition-colors duration-300 border-b border-outline-variant/10 last:border-b-0">
<span class="text-[14px] text-on-surface">Gemini 2.0 Flash</span>
<span class="text-[12px] text-on-surface-variant font-mono">1M</span>
</button>
<button class="w-full h-[52px] px-4 flex items-center justify-between hover:bg-surface-container-high transition-colors duration-300 border-b border-outline-variant/10 last:border-b-0">
<span class="text-[14px] text-on-surface">Gemini 1.5 Pro</span>
<span class="text-[12px] text-on-surface-variant font-mono">2M</span>
</button>
</div>
</div>
<!-- Group: META -->
<div>
<h3 class="text-[11px] font-semibold text-inverse-primary uppercase tracking-widest mb-2 px-2">Meta</h3>
<div class="bg-surface-container-low rounded-xl overflow-hidden border border-outline-variant/15">
<button class="w-full h-[52px] px-4 flex items-center justify-between hover:bg-surface-container-high transition-colors duration-300 border-b border-outline-variant/10 last:border-b-0">
<span class="text-[14px] text-on-surface">Llama 3.1 405B</span>
<span class="text-[12px] text-on-surface-variant font-mono">128K</span>
</button>
<button class="w-full h-[52px] px-4 flex items-center justify-between hover:bg-surface-container-high transition-colors duration-300 border-b border-outline-variant/10 last:border-b-0">
<span class="text-[14px] text-on-surface">Llama 3.1 70B</span>
<span class="text-[12px] text-on-surface-variant font-mono">128K</span>
</button>
</div>
</div>
</div>
</div>
</body></html>
