<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Confirmation Dialog - Medha</title>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#2a2a2c",
                        "on-tertiary-fixed-variant": "#e4e1e5",

                        "on-primary-fixed-variant": "#e2e2e2",

                        "surface-container-lowest": "#0e0e10",
                        "surface-bright": "#39393b",
                        "on-background": "#e5e1e4",
                        "inverse-on-surface": "#313032",
                        "background": "#131315",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-container": "#000000",
                        "error": "#ffb4ab",
                        "surface-dim": "#131315",
                        "tertiary-fixed": "#5f5e61",
                        "surface-tint": "#c6c6c7",
                        "primary-fixed-dim": "#454747",
                        "on-secondary": "#1b1b1e",
                        "primary": "#ffffff",
                        "tertiary-container": "#919094",
                        "primary-fixed": "#5d5f5f",
                        "inverse-surface": "#e5e1e4",
                        "surface-container-low": "#1c1b1d",
                        "on-secondary-fixed-variant": "#3b3b3e",
                        "tertiary": "#e4e1e5",
                        "inverse-primary": "#5d5f5f",
                        "on-error": "#690005",
                        "on-tertiary-fixed": "#ffffff",
                        "surface-variant": "#353437",
                        "surface-container-highest": "#353437",
                        "secondary": "#c8c5ca",
                        "on-secondary-fixed": "#1b1b1e",
                        "on-primary": "#1a1c1c",
                        "surface": "#131315",
                        "on-primary-container": "#000000",
                        "on-tertiary": "#1b1b1e",
                        "outline-variant": "#474747",
                        "secondary-container": "#47464a",
                        "on-secondary-container": "#e4e1e6",
                        "tertiary-fixed-dim": "#47464a",
                        "outline": "#919191",
                        "secondary-fixed": "#c8c5ca",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"

                    "spacing": {},
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }

<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background h-screen w-full overflow-hidden flex font-body">
<!-- Background Mockup (Drawer Open) -->
<div aria-hidden="true" class="absolute inset-0 flex">
<!-- Navigation Drawer Mockup -->
<nav class="h-full w-80 bg-surface-container-low border-r border-outline-variant/20 flex flex-col py-8 px-4 gap-2 z-10 hidden md:flex">
<div class="flex items-center gap-3 mb-8 px-2">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary text-xl">person_4</span>
</div>
<div class="flex flex-col">
<span class="font-bold text-primary">Synthesizer</span>
<span class="text-xs text-secondary">Pro Tier</span>
</div>
</div>
<!-- Mock Items -->
<div class="flex items-center gap-3 px-3 py-2 rounded-lg text-secondary hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined">add</span>
<span class="font-medium text-sm">New Chat</span>
</div>
<div class="flex items-center gap-3 px-3 py-2 rounded-lg bg-surface-variant text-primary font-medium">
<span class="material-symbols-outlined">database</span>
<span class="font-medium text-sm">Library</span>
</div>
</nav>
<!-- Main Content Area Mockup -->
<main class="flex-1 bg-background relative flex flex-col">
<!-- TopAppBar Mockup -->
<header class="flex justify-between items-center w-full px-6 h-16 bg-background border-b border-outline-variant/20">
<span class="material-symbols-outlined text-secondary">menu</span>
<h1 class="font-headline font-black tracking-widest text-primary text-xl">MONOLITH</h1>
<div class="w-8 h-8 rounded-full bg-surface-variant"></div>
</header>
<div class="p-6">
<!-- Mock chat content -->
</div>
</main>
</div>
<!-- Overlay (Dimmed Background) -->
<div aria-hidden="true" class="absolute inset-0 bg-black/60 z-40"></div>
<!-- Modal Dialog -->
<div class="absolute inset-0 flex items-center justify-center z-50 px-4">
<div class="bg-surface-container-lowest border border-outline-variant/50 rounded-xl w-full max-w-[85%] md:max-w-md p-6 flex flex-col items-center">
<!-- Icon -->
<div class="w-12 h-12 rounded-full bg-error/10 flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-error" style="font-size: 32px;">delete</span>
</div>
<!-- Title -->
<h2 class="font-headline font-semibold text-primary text-[18px] mb-2 text-center">Delete conversation?</h2>
<!-- Message -->
<p class="text-secondary text-[13px] text-center mb-6 leading-relaxed">
                This will permanently delete 'React Server Components explanation' and all its messages.
            </p>
<!-- Actions -->
<div class="flex w-full gap-3">
<button class="flex-1 bg-surface-container-low text-primary rounded-lg h-[44px] font-medium text-sm border border-outline-variant/20 hover:bg-surface-variant transition-colors" type="button">
                    Cancel
                </button>
<button class="flex-1 bg-error text-primary rounded-lg h-[44px] font-medium text-sm hover:bg-error/90 transition-colors" type="button">
                    Delete
                </button>
</div>
</div>
</div>
</body></html>
