<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Medha - Search</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#474747",
                        "tertiary-fixed-dim": "#47464a",
                        "tertiary": "#e4e1e5",
                        "on-primary-fixed-variant": "#e2e2e2",
                        "on-primary": "#1a1c1c",
                        "outline": "#919191",
                        "inverse-surface": "#e5e1e4",
                        "on-surface-variant": "#c6c6c6",
                        "primary": "#ffffff",
                        "surface-container": "#201f22",
                        "on-tertiary": "#1b1b1e",
                        "on-primary-fixed": "#ffffff",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed-dim": "#acaaae",
                        "background": "#131315",
                        "secondary": "#c8c5ca",
                        "tertiary-fixed": "#5f5e61",
                        "on-background": "#e5e1e4",
                        "surface-container-highest": "#353437",
                        "on-secondary-fixed-variant": "#3b3b3e",
                        "secondary-container": "#47464a",
                        "primary-fixed": "#5d5f5f",
                        "surface-dim": "#131315",
                        "tertiary-container": "#919094",
                        "on-secondary-container": "#e4e1e6",
                        "inverse-primary": "#5d5f5f",
                        "surface-tint": "#c6c6c7",
                        "on-tertiary-container": "#000000",
                        "error-container": "#93000a",
                        "error": "#ffb4ab",
                        "surface-container-low": "#1c1b1d",
                        "primary-fixed-dim": "#454747",
                        "surface-bright": "#39393b",
                        "surface": "#131315",
                        "on-secondary": "#1b1b1e",
                        "primary-container": "#d4d4d4",
                        "on-secondary-fixed": "#1b1b1e",
                        "on-tertiary-fixed-variant": "#e4e1e5",
                        "on-surface": "#e5e1e4",
                        "inverse-on-surface": "#313032",
                        "secondary-fixed": "#c8c5ca",
                        "surface-container-high": "#2a2a2c",
                        "on-tertiary-fixed": "#ffffff",
                        "surface-container-lowest": "#0e0e10",
                        "surface-variant": "#353437",
                        "on-primary-container": "#000000",
                        "on-error": "#690005"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#09090B] text-primary font-body antialiased flex flex-col h-screen overflow-hidden selection:bg-surface-container-highest selection:text-primary">
<!-- Search TopAppBar (Replaces standard TopAppBar JSON logic for focused intent) -->
<header class="flex items-center justify-between px-4 h-14 w-full border-b border-[#27272A] bg-[#09090B] shrink-0 sticky top-0 z-50">
<button aria-label="Close search" class="w-10 h-10 flex items-center justify-center text-[#A1A1AA] hover:bg-[#18181B] active:scale-95 transition-all rounded-full outline-none focus:ring-2 focus:ring-[#27272A]">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="flex-1 flex items-center px-2">
<input autofocus="" class="w-full bg-transparent border-none text-[#FAFAFA] text-[16px] placeholder:text-[#71717A] focus:outline-none focus:ring-0 p-0 m-0 caret-[#FAFAFA] font-body" placeholder="Search messages..." type="text" value="python"/>
</div>
<button aria-label="Clear search" class="w-10 h-10 flex items-center justify-center text-[#71717A] hover:text-[#FAFAFA] hover:bg-[#18181B] active:scale-95 transition-all rounded-full outline-none focus:ring-2 focus:ring-[#27272A]">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</header>
<!-- Canvas: Search Results -->
<main class="flex-1 overflow-y-auto w-full max-w-screen-xl mx-auto pb-24">
<div class="px-4 py-4 sticky top-0 bg-[#09090B]/95 backdrop-blur-md z-40 border-b border-transparent">
<h2 class="text-[12px] text-[#71717A] font-medium tracking-wide uppercase font-label">3 conversations</h2>
</div>
<div class="flex flex-col">
<!-- Result Row 1 -->
<button class="w-full text-left px-4 py-3 flex flex-col gap-1 active:bg-[#18181B] hover:bg-[#0E0E10] transition-colors border-b border-[#27272A]/50 outline-none focus:bg-[#18181B] group">
<div class="flex justify-between items-baseline w-full">
<span class="text-[14px] font-medium text-[#FAFAFA] truncate pr-4 group-hover:text-primary transition-colors">Python async patterns</span>
<span class="text-[12px] text-[#71717A] shrink-0 font-label">Yesterday</span>
</div>
<p class="text-[13px] text-[#A1A1AA] line-clamp-2 leading-relaxed">
                    ...use <strong class="text-[#FAFAFA] font-bold">python</strong> asyncio to handle concurrent...
                </p>
</button>
<!-- Result Row 2 -->
<button class="w-full text-left px-4 py-3 flex flex-col gap-1 active:bg-[#18181B] hover:bg-[#0E0E10] transition-colors border-b border-[#27272A]/50 outline-none focus:bg-[#18181B] group">
<div class="flex justify-between items-baseline w-full">
<span class="text-[14px] font-medium text-[#FAFAFA] truncate pr-4 group-hover:text-primary transition-colors">Debug memory leak in Node</span>
<span class="text-[12px] text-[#71717A] shrink-0 font-label">Apr 12</span>
</div>
<p class="text-[13px] text-[#A1A1AA] line-clamp-2 leading-relaxed">
                    ...similar to <strong class="text-[#FAFAFA] font-bold">python</strong>'s garbage collection...
                </p>
</button>
<!-- Result Row 3 -->
<button class="w-full text-left px-4 py-3 flex flex-col gap-1 active:bg-[#18181B] hover:bg-[#0E0E10] transition-colors border-b border-[#27272A]/50 outline-none focus:bg-[#18181B] group">
<div class="flex justify-between items-baseline w-full">
<span class="text-[14px] font-medium text-[#FAFAFA] truncate pr-4 group-hover:text-primary transition-colors">Help me write a script</span>
<span class="text-[12px] text-[#71717A] shrink-0 font-label">Apr 10</span>
</div>
<p class="text-[13px] text-[#A1A1AA] line-clamp-2 leading-relaxed">
                    ...here's a <strong class="text-[#FAFAFA] font-bold">python</strong> script that...
                </p>
</button>
</div>
</main>
<!-- BottomNavBar and FAB are intentionally suppressed per the "Task-Focused / Linear" rule in the Prompt. 
         This is a focused search overlay, not a main destination. -->
</body></html>
