<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Medha - Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-high": "#2a2a2c",
                    "on-tertiary": "#1b1b1e",
                    "primary": "#ffffff",
                    "surface-container": "#201f22",
                    "on-surface": "#e5e1e4",
                    "on-surface-variant": "#c6c6c6",
                    "background": "#131315",
                    "on-primary-fixed": "#ffffff",
                    "tertiary": "#e4e1e5",
                    "on-tertiary-fixed-variant": "#e4e1e5",
                    "secondary-container": "#47464a",
                    "on-secondary-container": "#e4e1e6",
                    "on-error": "#690005",
                    "secondary-fixed": "#c8c5ca",
                    "surface-tint": "#c6c6c7",
                    "on-primary": "#1a1c1c",
                    "on-secondary-fixed": "#1b1b1e",
                    "error": "#ffb4ab",
                    "on-secondary-fixed-variant": "#3b3b3e",
                    "inverse-on-surface": "#313032",
                    "tertiary-fixed": "#5f5e61",
                    "outline-variant": "#474747",
                    "surface-bright": "#39393b",
                    "on-secondary": "#1b1b1e",
                    "outline": "#919191",
                    "on-primary-fixed-variant": "#e2e2e2",
                    "on-tertiary-fixed": "#ffffff",
                    "secondary-fixed-dim": "#acaaae",
                    "surface-dim": "#131315",
                    "primary-fixed-dim": "#454747",
                    "on-error-container": "#ffdad6",
                    "inverse-surface": "#e5e1e4",
                    "on-tertiary-container": "#000000",
                    "surface-container-highest": "#353437",
                    "primary-fixed": "#5d5f5f",
                    "secondary": "#c8c5ca",
                    "surface-variant": "#353437",
                    "primary-container": "#d4d4d4",
                    "on-background": "#e5e1e4",
                    "surface": "#131315",
                    "inverse-primary": "#5d5f5f",
                    "on-primary-container": "#000000",
                    "surface-container-lowest": "#0e0e10",
                    "surface-container-low": "#1c1b1d",
                    "error-container": "#93000a",
                    "tertiary-fixed-dim": "#47464a",
                    "tertiary-container": "#919094"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {},
            "fontFamily": {
                    "headline": [
                            "Inter"
                    ],
                    "body": [
                            "Inter"
                    ],
                    "label": [
                            "Inter"
                    ]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col antialiased">
<!-- Top App Bar -->
<header class="flex justify-between items-center px-4 h-14 w-full bg-surface/90 backdrop-blur-md sticky top-0 z-50">
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline font-semibold text-primary text-base tracking-tight">Settings</h1>
<div class="w-10 h-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto pb-12 pt-4 px-4 space-y-8">
<!-- Card 1: AI Providers -->
<section>
<h2 class="text-xs font-semibold text-on-surface-variant tracking-widest uppercase mb-2 px-4">AI Providers</h2>
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant/15 overflow-hidden">
<!-- API Keys -->
<button class="w-full flex items-center justify-between h-[52px] px-4 hover:bg-surface-container transition-colors group">
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors text-[20px]" data-icon="key">key</span>
<span class="text-sm font-medium text-primary">API Keys</span>
</div>
<span class="material-symbols-outlined text-outline text-[16px]" data-icon="chevron_right">chevron_right</span>
</button>
<div class="h-[1px] bg-outline-variant/15 ml-11"></div>
<!-- Default Model -->
<button class="w-full flex items-center justify-between h-[52px] px-4 hover:bg-surface-container transition-colors group">
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors text-[20px]" data-icon="smart_toy">smart_toy</span>
<span class="text-sm font-medium text-primary">Default Model</span>
</div>
<div class="flex items-center space-x-2">
<span class="text-[13px] text-on-surface-variant">GPT-4o</span>
<span class="material-symbols-outlined text-outline text-[16px]" data-icon="chevron_right">chevron_right</span>
</div>
</button>
<div class="h-[1px] bg-outline-variant/15 ml-11"></div>
<!-- System Prompt -->
<button class="w-full flex items-center justify-between h-[52px] px-4 hover:bg-surface-container transition-colors group">
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors text-[20px]" data-icon="chat">chat</span>
<span class="text-sm font-medium text-primary">System Prompt</span>
</div>
<span class="material-symbols-outlined text-outline text-[16px]" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
<!-- Card 2: Appearance -->
<section>
<h2 class="text-xs font-semibold text-on-surface-variant tracking-widest uppercase mb-2 px-4">Appearance</h2>
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant/15 overflow-hidden">
<!-- Theme -->
<button class="w-full flex items-center justify-between h-[52px] px-4 hover:bg-surface-container transition-colors group">
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors text-[20px]" data-icon="palette">palette</span>
<span class="text-sm font-medium text-primary">Theme</span>
</div>
<div class="flex items-center space-x-2">
<span class="text-[13px] text-on-surface-variant">Dark</span>
<span class="material-symbols-outlined text-outline text-[16px]" data-icon="chevron_right">chevron_right</span>
</div>
</button>
<div class="h-[1px] bg-outline-variant/15 ml-11"></div>
<!-- OLED Mode -->
<div class="w-full flex items-center justify-between h-[52px] px-4">
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="dark_mode">dark_mode</span>
<span class="text-sm font-medium text-primary">OLED Black Mode</span>
</div>
<!-- Toggle Off -->
<button class="w-12 h-6 bg-surface-container-high rounded-full relative transition-colors focus:outline-none">
<span class="absolute left-1 top-1 bg-outline rounded-full w-4 h-4 transition-transform"></span>
</button>
</div>
</div>
</section>
<!-- Card 3: Security -->
<section>
<h2 class="text-xs font-semibold text-on-surface-variant tracking-widest uppercase mb-2 px-4">Security</h2>
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant/15 overflow-hidden">
<!-- Biometric -->
<div class="w-full flex items-center justify-between h-[52px] px-4">
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="fingerprint">fingerprint</span>
<span class="text-sm font-medium text-primary">Biometric Lock</span>
</div>
<!-- Toggle On -->
<button class="w-12 h-6 bg-primary rounded-full relative transition-colors focus:outline-none">
<span class="absolute right-1 top-1 bg-on-primary rounded-full w-4 h-4 transition-transform translate-x-0"></span>
</button>
</div>
</div>
</section>
<!-- Card 4: Data -->
<section>
<h2 class="text-xs font-semibold text-on-surface-variant tracking-widest uppercase mb-2 px-4">Data</h2>
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant/15 overflow-hidden">
<!-- Export -->
<button class="w-full flex items-center justify-between h-[52px] px-4 hover:bg-surface-container transition-colors group">
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors text-[20px]" data-icon="download">download</span>
<span class="text-sm font-medium text-primary">Export Conversations</span>
</div>
<span class="material-symbols-outlined text-outline text-[16px]" data-icon="chevron_right">chevron_right</span>
</button>
<div class="h-[1px] bg-outline-variant/15 ml-11"></div>
<!-- Delete -->
<button class="w-full flex items-center justify-between h-[52px] px-4 hover:bg-error-container/20 transition-colors group">
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-error text-[20px]" data-icon="delete">delete</span>
<span class="text-sm font-medium text-error">Delete All Data</span>
</div>
<span class="material-symbols-outlined text-error text-[16px] opacity-70 group-hover:opacity-100" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
<!-- Footer -->
<div class="flex flex-col items-center justify-center pt-8 pb-4 space-y-1">
<span class="text-[12px] text-on-surface-variant font-medium">Medha v1.0.0</span>
<span class="text-[12px] text-outline">Built with ❤️ in India</span>
</div>
</main>
</body></html>
